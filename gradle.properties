# Project-wide Gradle settings.
# IDE (e.g. Android Studio) users:
# Gradle settings configured through the IDE *will override*
# any settings specified in this file.
# For more details on how to configure your build environment visit
# http://www.gradle.org/docs/current/userguide/build_environment.html

# Specifies the JVM arguments used for the daemon process.
# Optimized memory and garbage collection settings for fast build execution.
org.gradle.jvmargs=-Xmx4096m -XX:+UseParallelGC -Dfile.encoding=UTF-8

# Execute tasks in parallel across decoupled projects / modules.
org.gradle.parallel=true

# Enable build caching to reuse task outputs across runs.
org.gradle.caching=true

# Configuration caching to skip the configuration phase when scripts haven't changed.
org.gradle.configuration-cache=true

# AndroidX migration support.
android.useAndroidX=true

# Enable non-transitive R classes for faster incremental compilation and smaller R classes.
android.nonTransitiveRClass=true

# Disable BuildConfig generation by default unless explicitly needed.
android.defaults.buildfeatures.buildconfig=false
android.sync.suppressAgpWarnings=UNSUPPORTED_PROJECT_OPTION_USE

# Kotlin incremental compilation for faster build feedback.
kotlin.incremental=true

# Enable KSP incremental processing
ksp.incremental=true

# Kotlin code style for this project: "official" or "obsolete":
kotlin.code.style=official

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
